<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Temple">
<meta name="theme-color" content="#16181b">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Iron Temple Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column. Sticky owner bar on top, tab content in the middle,
   a fixed action dock (Coach / Rest) and tab bar at the bottom where the thumb rests.
   Rubber-floor dark look with bumper-plate colors, by choice. */
:root {
  color-scheme: dark;
  --floor: #16181b;
  --speck: #22252a;
  --panel: #1f2226;
  --panel-2: #272b30;
  --line: #353a41;
  --chalk: #ecebe6;
  --muted: #9aa1a9;
  --red: #d8432f;
  --blue: #2f6fd8;
  --yellow: #ebbb24;
  --green: #36a35a;
  --white: #e4e4e0;
  --orange: #e27d2c;
  --purple: #8d62d8;
  --plumbob: #4fd36f;
  --up: #4cc274;
  --down: #ef6a55;
  --on-yellow: #1a1606;
  --dock-h: 186px;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body {
  background-color: var(--floor);
  background-image:
    radial-gradient(circle at 20% 30%, var(--speck) 1px, transparent 1.5px),
    radial-gradient(circle at 70% 80%, var(--speck) 1px, transparent 1.5px);
  background-size: 14px 14px, 19px 19px;
  color: var(--chalk); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
.app { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(var(--dock-h) + 16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
button { font: inherit; color: inherit; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

/* ---- owner bar ---- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--floor); padding-block: 10px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 7px; }
.hdr-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.k { font-family: var(--f-num); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.left { font-family: var(--f-num); font-weight: 700; font-size: 14px; }
.left .lim { color: var(--muted); font-weight: 500; }
.hdr-tools { display: flex; gap: 6px; align-items: center; min-width: 0; }
.gname { max-width: 10ch !important; font-family: var(--f-display); font-weight: 900; font-size: 17px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: none; border: 0; padding: 0 4px; max-width: 12ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; min-height: 36px; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.hdr-main { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.big { font-family: var(--f-num); font-weight: 700; font-size: clamp(24px, 7vw, 34px); line-height: 1; font-variant-numeric: tabular-nums; }
.cash { color: var(--yellow); text-align: right; }
.cash.neg { color: var(--down); }
.sub-line { display: flex; justify-content: space-between; gap: 6px 10px; font-family: var(--f-num); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.sub-line b { color: var(--chalk); font-weight: 500; }
.ebar { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.ebar > i { display: block; height: 100%; background: var(--green); width: 0; transition: width .2s; }
.ticker { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 13.5px; min-width: 0; cursor: pointer; width: 100%; text-align: left; }
.ticker span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ticker .k { flex: none; }

/* ---- generic blocks ---- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.sec { display: flex; justify-content: space-between; align-items: end; gap: 10px; margin-top: 6px; }
.sec h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; line-height: 1; text-wrap: balance; }
.sec p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.sec .meta { font-family: var(--f-num); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.list { display: grid; gap: 8px; }
.muted { color: var(--muted); }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.up-c { color: var(--up); } .down-c { color: var(--down); }

.btn { font-family: var(--f-num); font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 0 12px; min-height: 40px; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--chalk); white-space: nowrap; }
.btn.y { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); }
.btn.g { background: transparent; border-color: var(--up); color: var(--up); }
.btn.r { background: transparent; border-color: var(--down); color: var(--down); }
.btn.b { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { background: transparent; border-color: var(--line); color: var(--muted); cursor: not-allowed; opacity: .75; }

.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; }
.row .nm { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .nt { font-size: 12.5px; color: var(--muted); }
.row .rs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.row .pr { font-family: var(--f-num); font-weight: 700; font-size: 13.5px; text-align: right; display: grid; }
.row .pr small { font-weight: 500; font-size: 10.5px; color: var(--muted); }
.row.dim { opacity: .5; }
.row.cur { border-color: var(--green); box-shadow: inset 3px 0 0 var(--green); }
.tag { font-family: var(--f-num); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; border: 1px solid currentColor; }
.tag.done { color: var(--up); } .tag.open { color: var(--yellow); } .tag.lock { color: var(--muted); } .tag.study { color: var(--blue); } .tag.cur { color: var(--green); }

/* hustle cards */
.act { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 10px 10px; cursor: pointer; text-align: left; width: 100%; min-height: 68px; }
.act:active:not(:disabled) { transform: translateY(1px); border-color: var(--muted); }
.act:disabled { cursor: not-allowed; opacity: .5; }
.plate { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 3px rgba(0,0,0,.18); }
.plate i { width: 14px; height: 14px; border-radius: 50%; background: #c9cdd2; box-shadow: inset 0 0 0 3px #8e949b; display: block; }
.act .nm { font-family: var(--f-display); font-weight: 900; font-size: 22px; text-transform: uppercase; line-height: 1; letter-spacing: .02em; }
.act .nt { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.chip { font-family: var(--f-num); font-weight: 700; font-size: 12px; padding: 5px 8px; border-radius: 4px; background: var(--panel-2); color: var(--yellow); white-space: nowrap; text-align: right; }
.chip small { display: block; font-weight: 500; font-size: 10px; color: var(--muted); }

/* checklist + overhead */
.warm-h { display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; width: 100%; text-align: left; min-height: 36px; }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.step .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; color: var(--floor); margin-top: 1px; }
.step.done .ck { background: var(--up); border-color: var(--up); }
.step.done .st { text-decoration: line-through; color: var(--muted); }
.step .st { font-weight: 700; }
.step .sd { font-size: 12.5px; color: var(--muted); }
.step .rw { font-family: var(--f-num); font-size: 12px; color: var(--up); white-space: nowrap; }
.burn { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--down); border-radius: 6px; padding: 9px 12px; cursor: pointer; width: 100%; text-align: left; min-height: 44px; }
.burn .num { color: var(--down); font-weight: 700; }
.burn-list { display: grid; gap: 4px; font-size: 13px; padding: 8px 12px 4px; }
.burn-list div { display: flex; justify-content: space-between; gap: 10px; }
.outlook { border-left: 3px solid var(--up); }
.outlook[data-status="warn"] { border-left-color: var(--orange); }
.outlook[data-status="bad"] { border-left-color: var(--down); }
.pill { font-family: var(--f-num); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; vertical-align: 1px; }
.pill.ok { background: rgba(76,194,116,.16); color: var(--up); }
.pill.warn { background: rgba(226,125,44,.18); color: var(--orange); }
.pill.bad { background: rgba(239,106,85,.18); color: var(--down); }
.ol-lines { display: grid; gap: 5px; font-size: 13.5px; }
.ol-lines div { display: flex; justify-content: space-between; gap: 10px; }
.ol-lines .ol-next { margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; }
.warn-c { color: var(--orange); }
/* daily money ledger */
.ledger h3 { margin: 6px 0 2px; font-family: var(--f-num); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.ledger .ln { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 2px 0; }
.ledger .ln.sub { border-top: 1px solid var(--line); margin-top: 3px; padding-top: 5px; font-weight: 700; }
.ledger .ln.total { border-top: 2px solid var(--line); margin-top: 6px; padding-top: 7px; font-weight: 700; font-size: 15px; }
.ledger .ln .num { white-space: nowrap; }
/* gym mood */
.meter { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px; }
.meter .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.meter .bar > i { display: block; height: 100%; border-radius: 4px; transition: width .3s; }
.mood-parts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.mood-parts b { font-weight: 600; }
.rival { border: 1px solid var(--down); border-radius: 7px; padding: 10px 12px; display: grid; gap: 6px; background: rgba(239,106,85,.06); }
.rival .nm { font-family: var(--f-display); font-weight: 900; font-size: 20px; text-transform: uppercase; line-height: 1; }
/* focus picker in the dock */
.focus { grid-column: 1 / -1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.focus::-webkit-scrollbar { display: none; }
.focus button { flex: none; font-family: var(--f-num); font-size: 11.5px; font-weight: 700; padding: 0 11px; min-height: 32px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.focus button[aria-pressed="true"] { background: var(--chalk); border-color: var(--chalk); color: var(--floor); }
.focus-desc { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -2px; }
.codebox { width: 100%; min-height: 110px; padding: 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--chalk); font: 500 12px var(--f-num); box-sizing: border-box; resize: vertical; word-break: break-all; }

/* gym scene */
.scene { position: relative; border-radius: 7px; overflow: hidden; background: var(--panel-2); }
#gymCanvas { display: block; width: 100%; height: auto; aspect-ratio: 800 / 480; max-width: 100%; touch-action: manipulation; }
#gymCanvas.editing { touch-action: none; cursor: grab; }
.scene-cap { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; font-size: 13.5px; }
.scene-cap b { color: var(--plumbob); }
.edit-bar { display: grid; gap: 8px; }
.edit-bar .btns { justify-content: space-between; }
.store-list { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font-family: var(--f-num); font-size: 12px; background: transparent; color: var(--muted); border: 0; padding: 0 12px; min-height: 34px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--floor); }

/* supply room */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.idx { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 12px; align-items: center; }
.idx .big { font-size: 30px; }
.good { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.good-h { display: flex; justify-content: space-between; gap: 10px; }
.good-h .nm { font-weight: 700; font-size: 16px; }
.spark { width: 100%; height: 44px; display: block; }
.qty { display: grid; grid-template-columns: auto minmax(0, 1fr) 4ch; gap: 10px; align-items: center; }
.qty input { width: 100%; accent-color: var(--yellow); height: 32px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.fin { border-color: var(--blue); }
.fin dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; font-size: 14px; }
.fin dt { color: var(--muted); }
.fin dd { margin: 0; font-family: var(--f-num); text-align: right; }
.fin .tot { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 700; color: var(--chalk); }
.pbar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.pbar > i { display: block; height: 100%; background: var(--blue); width: 0; }

.credit { grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center; }
.credit svg { width: 96px; height: 96px; }
.credit .lvl { font-family: var(--f-display); font-weight: 900; font-size: 30px; text-transform: uppercase; line-height: 1; }
.nw-chart { width: 100%; height: 120px; display: block; }
.fin-list { gap: 0; }
.fin-list div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.fin-list div:last-child { border-bottom: 0; font-weight: 700; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.bigname { font-family: var(--f-display); font-weight: 900; font-size: 30px; text-transform: uppercase; line-height: 1; }

/* action dock + tab bar */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock { max-width: 680px; margin: 0 auto; padding: 8px 16px 6px; display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px; }
.dock > button { border-radius: 10px; min-height: 58px; cursor: pointer; display: grid; align-content: center; justify-items: start; gap: 1px; padding: 6px 14px; text-align: left; border: 0; }
.dock .coach { background: var(--yellow); color: var(--on-yellow); }
.dock .rest { background: var(--panel-2); border: 1px solid var(--line); }
.dock .t { font-family: var(--f-display); font-weight: 900; font-size: 21px; text-transform: uppercase; line-height: 1; }
.dock .s { font-family: var(--f-num); font-size: 11px; font-weight: 700; opacity: .8; }
.dock > button:active:not(:disabled) { transform: scale(.98); }
.dock > button:disabled { opacity: .45; cursor: not-allowed; }
nav.tabs .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
nav.tabs button { background: none; border: 0; cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 6px 2px 8px; color: var(--muted); font-size: 10.5px; font-weight: 600; position: relative; min-height: 50px; }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--yellow); }
nav.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 24%; right: 24%; height: 3px; border-radius: 0 0 3px 3px; background: var(--yellow); }

.floaty { position: fixed; pointer-events: none; font-family: var(--f-num); font-weight: 700; color: var(--yellow); font-size: 18px; animation: floatUp .9s ease-out forwards; text-shadow: 0 2px 0 var(--floor); z-index: 9; }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -60px); } }

/* modal + toast */
.modal-back { position: fixed; inset: 0; background: rgba(8,9,11,.72); z-index: 20; display: grid; place-items: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 420px; padding: 20px; display: grid; gap: 12px; max-height: 80vh; overflow: auto; -webkit-overflow-scrolling: touch; }
.modal h3 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 28px; text-transform: uppercase; line-height: 1.05; color: var(--yellow); text-wrap: balance; }
.modal p { margin: 0; }
.modal .btns { justify-content: flex-end; }
.modal .btns.stack { display: grid; }
.log-list { display: grid; gap: 6px; font-size: 13.5px; }
.log-list div { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
#toast { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--chalk); color: var(--floor); font-weight: 600; padding: 9px 14px; border-radius: 8px; max-width: calc(100% - 32px); z-index: 30; box-shadow: 0 6px 24px rgba(0,0,0,.45); text-align: center; }
@media (max-width: 420px) { .idx { grid-template-columns: 1fr; } .row .nm { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { .floaty { animation-duration: .01s; } .ebar > i { transition: none; } }
/* ---- map, legacy, milestones, hype ---- */
.gold-c { color: var(--yellow); }
.gp { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-left: 4px; vertical-align: -1px; background: radial-gradient(circle, var(--floor) 0 2px, var(--yellow) 2.6px); box-shadow: inset 0 0 0 1.5px #c99d14; }
.gp.big { width: 14px; height: 14px; }
.ms { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-top: 6px; font-size: 11px; color: var(--muted); }
.ms-bar { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.ms-bar i { display: block; height: 100%; background: var(--yellow); border-radius: 3px; transition: width .3s; }
.chal { border-left: 3px solid var(--yellow); }
.chal-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chal-t { font-weight: 700; font-size: 16px; margin: 6px 0 2px; }
.dead-card { border-color: var(--yellow); }
.dead-card p { margin: 0; }
.dock .coach { position: relative; overflow: hidden; }
.hype { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(0,0,0,.14); }
.hype i { display: block; height: 100%; width: 0; background: rgba(26,22,6,.55); transition: width .35s ease; }
.hype-lbl { position: absolute; right: 12px; top: 9px; font: 700 10px var(--f-num); opacity: .65; letter-spacing: .04em; text-transform: uppercase; }
.dock .coach.packed { background: linear-gradient(100deg, #ff9b4a, #ebbb24 40%, #ffd76a 50%, #ebbb24 60%, #ff9b4a); background-size: 220% 100%; animation: shimmer 2.2s linear infinite; }
@keyframes shimmer { from { background-position: 0 0; } to { background-position: -220% 0; } }
.usmap { width: 100%; height: auto; display: block; }
.usmap .land { fill: #2a3139; stroke: #3c444e; stroke-width: 1.6; stroke-linejoin: round; }
.usmap .grat { stroke: rgba(255,255,255,.045); stroke-width: 1; }
.usmap .route { stroke: var(--yellow); stroke-width: 1.8; stroke-dasharray: 4 5; opacity: .55; }

    if (!isFinite(n)) return "∞";
    if (n < 1000) return n < 100 && n % 1 ? n.toFixed(1) : Math.floor(n).toLocaleString("en-US");
    const e = Math.min(Math.floor(Math.log10(n) / 3), SUF.length - 1);
    const v = n / Math.pow(1000, e);
    return (v >= 100 ? v.toFixed(1) : v.toFixed(2)) + SUF[e];
  }
  function money(n) {
    const s = n < 0 ? "-" : ""; n = Math.abs(n);
    if (n < 1e4) return s + "$" + n.toFixed(2);
    if (n < 1e6) return s + "$" + Math.floor(n).toLocaleString("en-US");

    return m;

  const unitCost = (g, n) => g.base * Math.pow(1.15, n) * (1 - 0.04 * lv("deals"));
  const bulkCost = (g, n, k) => unitCost(g, n) * (Math.pow(1.15, k) - 1) / 0.15;
  const maxAfford = (g, n, m) => Math.max(0, Math.floor(Math.log(Math.max(0, m) * 0.15 / unitCost(g, n) + 1) / Math.log(1.15)));
  function tierIndex() { let i = 0; TIERS.forEach((t, j) => { if (S.runEarned >= t.at) i = j; }); return i; }

  const focus = () => FOCUS.find(f => f.id === S.focus) || FOCUS[0];
  const focusDuesMult = () => ({ sales: 1.2, clean: 0.9, self: 0.9 }[S.focus] || 1);
  const season = () => { const d = S.day % 365; return SEASONS.find(x => d >= x.from && d <= x.to); };
  function seasonMult() { const s = season(); let m = s.mult; if (s.hot) m *= cm("hot", 1); if (s.cold) m *= cm("cold", 1); return m; }
  const wage = st => st.base + st.pct * baseDues();
  const amenCost = a => a.base * Math.pow(a.grow, S.owned[a.id] || 0);
  const nameOf = t => (GEN_BY_ID[t] || AMEN.find(a => a.id === t) || { name: t }).name;
  const placedOf = t => S.layout.filter(i => i.t === t && i.c != null).length;
  function floorStats() {
    const grid = occupied();
    let used = 0; grid.forEach(r => r.forEach(v => { if (v) used++; }));
    let cramped = 0;
    S.layout.forEach(it => {
      if (it.c == null) return;
      const fp = FP[it.t]; let free = 0;
      for (let c = it.c; c < it.c + fp.w; c++) { if (it.r - 1 >= 0 && !grid[it.r - 1][c]) free++; if (it.r + fp.h < ROWS && !grid[it.r + fp.h][c]) free++; }
      for (let r = it.r; r < it.r + fp.h; r++) { if (it.c - 1 >= 0 && !grid[r][it.c - 1]) free++; if (it.c + fp.w < COLS && !grid[r][it.c + fp.w]) free++; }
      if (!free) cramped++;
    });
    return { fill: used / (COLS * ROWS), cramped };
  }
  function moodParts() {
    const g = floorStats();
    const parts = [["Base", 55]];
    if (cm("happy", 0)) parts.push([city().name, cm("happy", 0)]);
    const am = Math.min(placedOf("plant"), 6) * 1.5 + Math.min(placedOf("fountain"), 3) * 3 + (placedOf("lockers") ? 12 : 0) + (placedOf("lounge") ? 8 : 0);
    if (am) parts.push(["Amenities", am]);
    parts.push(["Cleanliness", Math.round((S.clean - 60) * 0.3)]);
    if (g.fill > 0.55) parts.push(["Crowded floor", -Math.round((g.fill - 0.55) * 60)]);
    if (g.cramped) parts.push([g.cramped + " boxed-in item" + (g.cramped > 1 ? "s" : ""), -Math.min(16, 4 * g.cramped)]);
    if (S.staff.desk) parts.push(["Front desk", 3]);
    if (S.staff.manager) parts.push(["Manager", 4]);
    return parts;
  }
  const moodTarget = () => Math.max(0, Math.min(100, moodParts().reduce((a, x) => a + x[1], 0)));
  const happyMult = () => 0.6 + 0.8 * S.happy / 100;
  const happyLabel = h => h < 35 ? "Members are canceling" : h < 50 ? "Grumbling" : h < 70 ? "Content" : h < 85 ? "Happy" : "Loving it";
  const rivalCut = () => S.rival ? 0.1 + S.rival.str * 0.0025 : 0;
  // dues you actually collect today, after every modifier
  function income() {
    return baseDues() * happyMult() * seasonMult() * (1 - rivalCut()) * (S.staff.desk ? 1.12 : 1) * focusDuesMult() * cm("dues", 1) * (S.packed > 0 ? 2 : 1);
  }
  // every gym from your past lives pays a small royalty every day
  const ROYALTY = 0.015;
  const royaltyOf = g => (g.dues || 0) * ROYALTY * (1 + 0.5 * lv("royal"));
  const royalties = () => S.chain.reduce((a, g) => a + royaltyOf(g), 0);
  const coachMult = () => (S.certs.cpt ? 2 : 1) * (S.certs.kin ? 3 : 1) * (1 + 0.25 * lv("coach")) * cm("coach", 1);
  const coachValue = () => (3 + income() * 0.5) * coachMult();
  const coachToday = () => coachValue() * (S.focus === "sales" ? 1.4 : 1);
  function hustleMult(h) {
    let m = (S.gear.tees ? 1.25 : 1);
    if (h.id === "flyers" && S.gear.dog) m *= 1.5;
    if (h.id === "boot" && S.gear.clip) m *= 1.3;
    return m;
  }
  const eventCost = () => S.focus === "events" ? 10 + income() * 0.1 : 0;
  const interestToday = () => S.bankOpen && S.savings > 0 ? S.savings * 0.04 / 365 : 0;
  const certCost = c => c.cost * cm("cert", 1);
  const certDays = c => Math.max(1, Math.round(c.days * cm("study", 1)));
  const debtLimit = () => 14 + 3 * lv("stomach");

  const home = () => HOMES.find(h => h.id === S.home) || HOMES[0];
  const food = () => FOODS.find(f => f.id === S.food) || FOODS[0];
  const maxEnergy = () => home().max;
  const certLife = () => CERTS.reduce((a, c) => a + (S.certs[c.id] ? c.life : 0), 0);
  const lifespanDays = () => BASE_DAYS + 20 * lv("genes") + cm("life", 0) + home().life + food().life + certLife() + S.physique * 1.5 + S.bonusDays;
  const ageDays = () => START_AGE * 365 + S.day;
  const daysLeft = () => lifespanDays() - S.day;

  function burnItems() {
    const items = [];
    if (home().burn) items.push(["Rent · " + home().name, home().burn * cityCost(), "life"]);
    items.push(["Meals · " + food().name, food().burn * cityCost(), "life"]);
    const oh = income() * 0.1;
    if (oh > 0) items.push(["Gym lease & utilities", oh]);
    STAFF.forEach(st => { if (S.staff[st.id]) items.push([st.name + " wages", wage(st)]); });
    if (S.focus === "events") items.push(["Member event", eventCost()]);
    GEAR.forEach(g => { if (S.gear[g.id] && g.burn) items.push([g.name + " upkeep", g.burn]); });
    S.loans.forEach(l => items.push([l.kind + " loan payment", Math.min(l.pay, l.bal)]));
    return items;
  }
  const burn = () => burnItems().reduce((a, b) => a + b[1], 0);
  const loanTotal = () => S.loans.reduce((a, l) => a + l.bal, 0);
  const equipValue = () => S.spentEquip * 0.5;
  const netWorth = () => S.cash + S.savings + equipValue() - loanTotal();
  function makeLoan(kind, amount, fee, days) { const total = amount * (1 + fee); return { kind, bal: total, pay: total / days, fee }; }
  const emergencyLimit = () => Math.max(0, Math.floor(150 + 20 * (income() + coachToday()) - S.loans.filter(l => l.kind === "Emergency").reduce((a, l) => a + l.bal, 0)));
  const platesFor = () => Math.max(0, Math.floor(S.day / 50 + Math.sqrt(Math.max(0, S.bestNet) / 2000) + S.peakTier * 1.5 + Object.keys(S.certs).length * 0.5 + S.rivalsBeaten));

  function earn(v) { S.cash += v; S.runEarned += v; S.lifetime += v; }
  function logMsg(m) { S.log.unshift({ d: S.day, m }); if (S.log.length > 80) S.log.length = 80; }

  // ======================= A DAY PASSES =======================
  // Every action that takes time (coach, rest, hustle, train) calls this once.
  function passDay(what) {
    if (S.dead) return;
    S.day++;
    const dues = income(), roy = royalties(), bills = burn();
    if (dues > 0) earn(dues);
    if (roy > 0) earn(roy);
    S.loans.forEach(l => { l.bal -= Math.min(l.pay, l.bal); });
    const paid = S.loans.filter(l => l.bal <= 0.005);
    if (paid.length) { paid.forEach(l => logMsg("Paid off your " + l.kind.toLowerCase() + " loan.")); S.loans = S.loans.filter(l => l.bal > 0.005); }
    S.cash -= bills;
    let note = "";
    if (S.cash < 0) {
      // in debt: you can't buy food, so no energy comes back, and the stress costs life
      S.cash *= 1.01; S.debtDays++;
      S.bonusDays -= 2; note = " In debt (day " + S.debtDays + " of " + debtLimit() + "): skipped meals, −2 days of life.";
    } else {
      S.debtDays = 0;
      S.energy = Math.min(maxEnergy(), S.energy + food().regen);
    }
    if (S.focus === "self") { S.energy = Math.min(maxEnergy(), S.energy + 15); S.physique = Math.min(100, S.physique + 1); }
    if (S.packed > 0) { S.packed--; if (!S.packed) logMsg("The packed house is over. Back to normal."); }
    gymDay();
    if (S.bankOpen && S.savings > 0) S.savings += interestToday();
    if (S.study) {
      S.study.left--;
      if (S.study.left <= 0) {
        const c = CERT_BY_ID[S.study.id]; S.certs[c.id] = true; S.study = null;
        logMsg("You earned your " + c.name + "! +" + lifeTxt(c.life) + " life.");
        notify("Certified", "You earned your " + c.name + ". " + c.perk + ". It also adds " + lifeTxt(c.life) + " to your life.", "Nice");
        challengeTick("cert", 1);
        sceneDirty = true;
      }
    }
    const nw = netWorth();
    S.nwHist.push(nw); if (S.nwHist.length > 60) S.nwHist.shift();
    S.bestNet = Math.max(S.bestNet, nw);
    S.peakTier = Math.max(S.peakTier, tierIndex());
    logMsg((what ? what + " · " : "") + (dues > 0 ? "dues +" + money(dues) + " · " : "") + (roy > 0 ? "royalties +" + money(roy) + " · " : "") + "bills −" + money(bills) + "." + note);
    if (S.day % 365 === 0) logMsg("Happy birthday! You turned " + Math.floor(ageDays() / 365) + ".");
    checkWarm();
    if (daysLeft() <= 0) { die(); return; }
    if (S.debtDays >= debtLimit()) { die("starved"); return; }
    const toGo = debtLimit() - S.debtDays;
    if (S.debtDays && (toGo === 11 || toGo === 7 || toGo === 3)) {
      notify("In debt for " + S.debtDays + " days", "You can't afford food. You get no energy back and lose 2 extra days of life each day. After " + debtLimit() + " days in a row below $0 you starve. " + toGo + " days to get back above $0.", "I'll fix it");
      buzz("warn");
    }
    checkOutlook();
    if (S.day >= S.nextEvent) { S.nextEvent = S.day + Math.floor(rnd(14, 32)); fireEvent(); }
  }
  function gymDay() {
    const placedCount = S.layout.filter(i => i.c != null).length;
    S.clean = Math.max(0, Math.min(100, S.clean - (2 + placedCount * 0.12) + (S.staff.cleaner ? 10 : 0) + (S.focus === "clean" ? 30 : 0)));
    const ev = cm("events", 1);
    const fd = { sales: -4, clean: 2, events: 6 * ev, self: -2 }[S.focus] || 0;
    S.happy = Math.max(0, Math.min(100, S.happy + (moodTarget() - S.happy) * 0.25 + fd));
    if (S.focus === "events") addHype(12 * ev);
    if (S.focus === "sales") addHype(3);
    const since = id => S.day - (S.cd[id] ?? -999);
    if (S.happy < 35 && since("warnHappy") >= 20) {
      S.cd.warnHappy = S.day;
      notify("Members are canceling", "Happiness is down to " + Math.round(S.happy) + ". Unhappy members cancel, so dues drop. Clean up, give equipment some space, add amenities, or run a member event.");
    }
    if (S.clean < 25 && since("dirty") >= 25) {
      S.cd.dirty = S.day; S.happy = Math.max(0, S.happy - 8);
      notify("Members complain about the smell", "The locker area is gross and people noticed. Happiness −8. A Deep clean day or a Cleaner fixes this.");
    }
    // seasons and their challenges
    const sn = season();
    const key = sn.name + "#" + Math.floor(S.day / 365);
    if (!S.chal || S.chal.key !== key) {
      if (S.seasonName) logMsg(sn.name + " starts. Dues ×" + seasonMult().toFixed(2) + ". New challenge: " + sn.ch.text + ".");
      S.chal = { key, prog: 0, done: false };
    }
    S.seasonName = sn.name;
    if (sn.ch.id === "clean" && S.clean >= 70) challengeTick("clean", 1);
    if (sn.ch.id === "happy" && S.happy >= 70) challengeTick("happy", 1);
    if (sn.ch.id === "nodebt" && S.cash >= 0) challengeTick("nodebt", 1);
    // rivals
    if (S.rival) {
      S.rival.str += (55 - S.happy) * 0.25 - (S.focus === "events" ? 4 * ev : 0) - (S.focus === "sales" ? 1.5 : 0) - (S.staff.manager ? 1 : 0);
      S.rival.str = Math.min(150, S.rival.str);
      if (S.rival.str <= 0) {

        earn(prize); S.happy = Math.min(100, S.happy + 5); S.cd.rival = S.day; S.rivalsBeaten++;
        logMsg(S.rival.name + " closed. Their members joined you: +" + money(prize) + ".");

      }
    } else if (S.day > 45 && S.runEarned > 1000 && since("rival") >= 150 && Math.random() < 0.012 * cm("rival", 1)) {

      logMsg(S.rival.name + " opened across the street.");
      openModal("A rival gym opened", S.rival.name + " opened across the street and is pulling your members away. They take " + Math.round(rivalCut() * 100) + "% of your dues until you win people back. Keep happiness above 55, run member events and push sales to wear them down. Beat them for a Golden Plate.", [["Game on", () => {}]]);

  }
  function challengeTick(id, n) {

  // ======================= WARM-UP =======================
  const WARM = [

    { id: "w2", t: "Put equipment on the floor", d: "Buy yoga mats below. They pay dues every day.", r: "+$15", ok: () => GENS.some(g => S.owned[g.id]), give: () => earn(15) },
    { id: "w3", t: "Get off the office couch", d: "Life tab. Better housing adds days to your life.", r: "+20d life", ok: () => S.home !== "couch", give: () => { S.bonusDays += 20; } },

  }

  // ======================= OUTLOOK =======================
  function lifeOptions() {
    const opts = [];
    const hi = HOMES.findIndex(h => h.id === S.home);
    const nh = HOMES[hi + 1];
    if (nh) opts.push({ name: nh.name, cost: S.homesOwned[nh.id] ? 0 : nh.cost, days: nh.life - home().life, extra: (nh.burn - home().burn) * cityCost(), study: 0, tab: "life" });
    const fi = FOODS.findIndex(f => f.id === S.food);
    const nf = FOODS[fi + 1];
    if (nf) opts.push({ name: nf.name, cost: 0, days: nf.life - food().life, extra: (nf.burn - food().burn) * cityCost(), study: 0, tab: "life" });
    if (!S.study) CERTS.forEach(c => { if (certState(c) === "open") opts.push({ name: c.name, cost: certCost(c), days: c.life, extra: 0, study: certDays(c), tab: "certs" }); });
    if (S.cd.check == null || S.day - S.cd.check >= 90) opts.push({ name: "Doctor checkup", cost: 250, days: 20, extra: 0, study: 0, tab: "life" });
    return opts.filter(o => o.days > 0);
  }
  function outlook() {
    const dues = income() + royalties(), bills = burn();
    const coachDay = coachToday() * Math.min(1, food().regen / COACH_EN);
    const net = dues + coachDay - bills;
    const left = Math.floor(daysLeft());
    const brokeIn = net < 0 ? Math.floor(Math.max(0, S.cash) / -net) : Infinity;
    const scored = lifeOptions().map(o => {
      const pace = net - o.extra;
      const gap = Math.max(0, o.cost - S.cash);
      const wait = gap === 0 ? (pace >= 0 ? 0 : Infinity) : (net > 0 ? Math.ceil(gap / net) : Infinity);
      const ready = wait + o.study < left && pace >= 0;
      const needPerDay = Math.max(0, (o.cost - S.cash) / Math.max(1, left - o.study - 1) - net) + Math.max(0, -pace);
      return Object.assign(o, { wait, ready, needPerDay });
    });
    const reachable = scored.filter(o => o.ready).sort((a, b) => a.wait - b.wait || b.days - a.days);
    const cheapest = scored.slice().sort((a, b) => a.needPerDay - b.needPerDay)[0] || null;
    const best = reachable[0] || cheapest;
    let status = "ok";
    if ((net < 0 && brokeIn < left) || left < 60) status = "warn";
    if ((net < 0 && brokeIn < 15) || (left < 90 && !reachable.length) || S.debtDays) status = "bad";
    return { dues, bills, coachDay, net, left, brokeIn, best, reachable, status };
  }
  function checkOutlook() {
    if (S.dead) return;
    const o = outlook();
    const since = id => S.day - (S.cd[id] ?? -999);
    if (o.left < 90 && !o.reachable.length && since("warnLife") >= 15) {
      S.cd.warnLife = S.day;
      const b = o.best;
      openModal("This life isn't sustainable",
        "At this pace you'll die in " + o.left + " days. " + (b
          ? "The cheapest way to buy time is " + b.name + " (+" + lifeTxt(b.days) + "), but you can't afford it in time. You need to make about " + money(b.needPerDay) + " more per day."
          : "There's nothing left to buy that adds life. Make the most of the time you have."),
        b ? [["Show me", () => setTab(b.tab)], ["Keep going", () => {}]] : [["Keep going", () => {}]]);
      buzz("warn");
    } else if (o.net < 0 && o.brokeIn < 15 && since("warnCash") >= 15) {
      S.cd.warnCash = S.day;
      openModal("Money is running out",
        "You're losing " + money(-o.net) + " a day, even coaching every day. Cash runs out in " + o.brokeIn + " days. Below $0 you skip meals, lose 2 extra days of life a day, and after " + debtLimit() + " days you starve. Make " + money(-o.net) + " more per day or cut costs.",
        [["Keep going", () => {}]]);
      buzz("warn");
    } else if ((o.left === 30 || o.left === 10) && since("warnSoon") >= 5) {
      S.cd.warnSoon = S.day;
      notify(o.left + " days left", "Your time is almost up. " + (o.best ? "Best way to buy time now: " + o.best.name + (o.best.cost ? " for " + money(o.best.cost) : "") + " (+" + lifeTxt(o.best.days) + ")." : "Spend it well.") + " When this life ends you'll earn about " + platesFor() + " Golden Plates.");
    }
  }

  // ======================= EVENTS =======================

  // When a life ends the gym joins your chain, you bank Golden Plates and pick your next city.
  function die(reason) {
    if (S.dead && S.deathDone) { showDeath(); return; }
    S.dead = true; S.deathReason = reason || S.deathReason || "";
    const gain = platesFor();
    const before = CITIES.filter(c => c.need <= S.platesEarned).length;
    S.plates += gain; S.platesEarned += gain;
    const unlocked = CITIES.filter(c => c.need <= S.platesEarned).slice(before);
    const tierName = TIERS[S.peakTier].name;
    S.chain.push({ city: S.city, life: S.lives, days: S.day, bestNet: S.bestNet, tier: tierName, dues: income() / (S.packed > 0 ? 2 : 1) });
    const h = S.hof[S.city] || { lives: 0, bestDays: 0, bestNet: 0 };
    S.hof[S.city] = { lives: h.lives + 1, bestDays: Math.max(h.bestDays, S.day), bestNet: Math.max(h.bestNet, S.bestNet) };
    S.deathGain = gain; S.deathUnlocked = unlocked.map(c => c.id); S.deathDone = true;
    save(); buzz("warn");
    showDeath();
  }
  function showDeath() {

    const unl = (S.deathUnlocked || []).map(id => CITY_BY_ID[id].name);
    openModal(reason === "starved" ? "Starved" : reason === "retired" ? "Retired" : "Final whistle",
      how + " Your " + city().name + " gym lasted " + S.day + " days and reached " + TIERS[S.peakTier].name + ". It joins your chain and will pay royalties every day from now on. You earned " + (S.deathGain || 0) + " Golden Plates." + (unl.length ? " New cities unlocked: " + unl.join(", ") + "." : ""),

  }

  // ======================= SAVE =======================
  // main save every action, plus an automatic backup every 10 days in case the main one gets damaged
  function save() {
    try {
      const json = JSON.stringify(S);
      localStorage.setItem(SAVE_KEY, json);
      if (S.day % 10 === 0 || !localStorage.getItem(SAVE_KEY + ":bak")) localStorage.setItem(SAVE_KEY + ":bak", json);
    } catch (e) {}
  }
  const validSave = o => o && typeof o === "object" && isFinite(o.cash) && isFinite(o.day) && o.owned && typeof o.owned === "object";
  let restoredFromDay = null;
  function migrate(o) {
    const s = Object.assign(fresh(), o);
    // older saves: drop the removed systems and turn the old per-item upgrades into levels
    delete s.goods; delete s.fund; delete s.credit; delete s.store; delete s.shelves; delete s.legacy;
    Object.keys(s.ups).forEach(k => { if (k.startsWith("u_")) delete s.ups[k]; });
    if (!CITY_BY_ID[s.city]) s.city = "columbus";
    if (!Array.isArray(s.layout)) s.layout = [];
    return s;
  }
  function load() {
    let damaged = false;
    try { const r = localStorage.getItem(SAVE_KEY); if (r) { const o = JSON.parse(r); if (validSave(o)) return migrate(o); damaged = true; } } catch (e) { damaged = true; }
    const b = readBackup();
    if (b) { if (damaged) restoredFromDay = b.day; return migrate(b); }
    return null;
  }
  function readBackup() { try { const b = localStorage.getItem(SAVE_KEY + ":bak"); if (b) { const o = JSON.parse(b); if (validSave(o)) return o; } } catch (e) {} return null; }
  function exportCode() {
    const copy = Object.assign({}, S, { log: S.log.slice(0, 5) });
    return "ITT1:" + btoa(unescape(encodeURIComponent(JSON.stringify(copy))));
  }
  function importCode(code) {
    try {
      const raw = code.trim().replace(/^ITT1:/, "");
      const o = JSON.parse(decodeURIComponent(escape(atob(raw))));
      if (!validSave(o)) return false;
      S = migrate(o);
      syncLayout(); resetScene(); lastTier = -1; buildTab(); save();
      logMsg("Loaded a backup code (day " + S.day + ").");
      return true;
    } catch (e) { return false; }
  }

  function occupied(skipKey) {
    const g = Array.from({ length: ROWS }, () => new Array(COLS).fill(false));
    S.layout.forEach(it => { if (it.c == null || it.k === skipKey) return; const fp = FP[it.t]; for (let r = it.r; r < it.r + fp.h; r++) for (let c = it.c; c < it.c + fp.w; c++) if (g[r]) g[r][c] = true; });

  }
  function fits(t, c, r, grid) {
    const fp = FP[t];
    if (c < 0 || r < 0 || c + fp.w > COLS || r + fp.h > ROWS) return false;
    for (let y = r; y < r + fp.h; y++) for (let x = c; x < c + fp.w; x++) if (grid[y][x]) return false;
    return true;
  }
  function autoPlace(it) {
    const fp = FP[it.t], grid = occupied(it.k);
    let best = null, bd = 1e9;
    for (let r = 0; r <= ROWS - fp.h; r++) for (let c = 0; c <= COLS - fp.w; c++) {
      if (!fits(it.t, c, r, grid)) continue;
      const d = Math.hypot(c - fp.anchor[0], (r - fp.anchor[1]) * 1.3);
      if (d < bd) { bd = d; best = [c, r]; }
    }
    if (best) { it.c = best[0]; it.r = best[1]; return true; }
    it.c = null; it.r = null; return false;
  }
  // make the layout match what you own: add new items, drop sold ones
  function syncLayout() {
    let stored = 0;
    Object.keys(FP).forEach(t => {
      const own = Math.min(S.owned[t] || 0, FLOOR_CAP[t] ?? 99);
      let items = S.layout.filter(i => i.t === t);
      while (items.length > own) { const drop = items.find(i => i.c == null) || items[items.length - 1]; S.layout.splice(S.layout.indexOf(drop), 1); items = S.layout.filter(i => i.t === t); }
      for (let n = items.length; n < own; n++) { const it = { k: S.nextKey++, t, c: null, r: null }; S.layout.push(it); if (!autoPlace(it)) stored++; }
    });
    sceneDirty = true;
    return stored;
  }

  const SKIN = ["#f1c7a5", "#e0a77f", "#c68658", "#8d5a3b", "#5e3b28", "#f5d6bd"];

  const NAMES = ["Dana", "Marcus", "Priya", "Theo", "Lena", "Kofi", "Rosa", "Jin", "Ava", "Omar", "Sky", "Nina", "Ravi", "Tess", "Leo", "Mia", "Yusuf", "Ivy", "Cal", "Zoe", "Ben", "Hana", "Eli", "Noor"];

  const ACT_LABEL = { walk: "is walking over", idle: "is catching their breath", run: "is running on a treadmill", curl: "is curling dumbbells", squat: "is squatting", mat: "is doing sit-ups", sauna: "is in the sauna", drink: "is drinking a smoothie", swim: "is swimming laps", flex: "is posing on stage", desk: "is checking members in", mop: "is mopping the floor", clip: "is going over the numbers", sip: "is grabbing some water", lounge: "is foam rolling", coach: "is coaching a member", leave: "is heading home", enter: "just walked in" };

  function buildFixtures() {
    fixtures = S.layout.filter(it => it.c != null).map(it => {
      const fp = FP[it.t];
      const x = it.c * CELL, y = WALL + it.r * CELL;
      const flat = it.t === "mat" || it.t === "pool" || it.t === "arena" || it.t === "lounge";
      const sortY = { bells: y + 42, tread: y + 14, rack: y + 62, bar: y + 4, sauna: y + 146, plant: y + 34, fountain: y + 22, lockers: y + 66 }[it.t] ?? y;

  function spawn(role) {

  function moveTo(p, x, y, act) { p.tx = x; p.ty = y; p.state = "go"; p.act = act || "walk"; }
  function goWander(p) {
    const grid = occupied();
    // avoid cells where someone is already standing around
    const taken = new Set(people.filter(q => q !== p && q.after === "idle").map(q => Math.floor(q.tx / CELL) + "," + Math.floor((q.ty - WALL) / CELL)));
    for (let i = 0; i < 30; i++) {
      const c = Math.floor(rnd(0, COLS)), r = Math.floor(rnd(1, ROWS));
      if (!grid[r][c] && !taken.has(c + "," + r)) { moveTo(p, c * CELL + 20 + rnd(-6, 6), WALL + r * CELL + 28, "walk"); p.after = "idle"; return; }
    }
    moveTo(p, rnd(80, 300), rnd(400, 440), "walk"); p.after = "idle";

      if (busy.length && Math.random() < 0.8) { const m = pick(busy); p.coachee = m.id; moveTo(p, Math.min(W - 10, m.x + 20), m.y + 3, "walk"); p.after = "coach"; }
      else goWander(p);
      return;
    }
    if (p.role === "celeb") { goWander(p); p.after = Math.random() < 0.6 ? "flex" : "idle"; return; }
    if (p.role === "desk") { moveTo(p, 118, 457, "walk"); p.after = "desk"; return; }
    if (p.role === "cleaner" || p.role === "manager") { goWander(p); p.after = p.role === "cleaner" ? "mop" : "clip"; return; }
    const free = [];
    fixtures.forEach(f => f.spots.forEach((s, i) => { if (!s.taken) free.push([f, s, i]); }));
    if (free.length && Math.random() < 0.85) {

  function release(p) { if (p.spot) { p.spot.taken = null; p.spot = null; } p.hidden = false; }
  function updatePerson(p, dt, t) {
    // fade in at the door, fade out when leaving
    if (p.act === "leave") { const dd = Math.hypot(p.x - DOOR.x, p.y - DOOR.y); if (dd < 50) p.alpha = Math.max(0, Math.min(p.alpha, dd / 50)); }
    else p.alpha = Math.min(1, p.alpha + dt * 2.5);
    if (p.state === "go") {
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);

      const ease = d < 14 ? Math.max(0.35, d / 14) : 1;

        if (p.after === "use" && p.spot) {

  }

  // ======================= MODAL / TOAST =======================
  // Popups stay until you tap a button. If one is already showing, the next waits its turn.
  let modalOpen = false;
  const modalQueue = [];
  function openModal(title, body, buttons, sticky, stack) {
    if (modalOpen) { modalQueue.push([title, body, buttons, sticky, stack]); return; }
    modalOpen = true;
    const back = E("div", "modal-back"); const m = E("div", "modal"); m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true");
    const h = E("h3"); h.textContent = title; m.append(h);
    if (typeof body === "string") { const p = E("p"); p.textContent = body; m.append(p); } else m.append(body);
    const bs = E("div", "btns" + (stack ? " stack" : ""));
    buttons.forEach(([label, fn], i) => { const b = E("button", "btn " + (i === 0 ? "y" : "")); b.type = "button"; b.textContent = label; b.addEventListener("click", () => { closeModal(); fn(); refresh(); save(); }); bs.append(b); });
    m.append(bs); back.append(m);
    el("modalRoot").innerHTML = ""; el("modalRoot").append(back);
  }
  function closeModal() {
    modalOpen = false; el("modalRoot").innerHTML = "";
    if (modalQueue.length) setTimeout(() => { if (!modalOpen && modalQueue.length) openModal(...modalQueue.shift()); }, 120);
  }
  // a one-button popup for news worth stopping for
  function notify(title, text, btn) { openModal(title, text, [[btn || "Got it", () => {}]]); }
  let toastT = 0;
  function toast(msg) { const t = el("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3000); }
  function showLog() {
    const l = E("div", "log-list");
    if (!S.log.length) l.append(E("div", "muted", "Nothing yet."));
    S.log.slice(0, 50).forEach(x => { const d = E("div"); d.append(E("span", "muted num", "Day " + x.d)); const s = E("span"); s.textContent = x.m; d.append(s); l.append(d); });
    openModal("Front desk log", l, [["Close", () => {}]]);
  }
  function showExport() {
    const wrap = E("div"); wrap.style.cssText = "display:grid;gap:8px";
    const ta = E("textarea", "codebox"); ta.readOnly = true; ta.value = exportCode(); ta.id = "exportCode"; ta.setAttribute("aria-label", "Backup code");
    const copy = E("button", "btn y", "Copy code"); copy.type = "button";
    copy.addEventListener("click", () => {
      const done = () => { copy.textContent = "Copied"; };
      try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); copy.textContent = "Selected. Copy it now"; }); }
      catch (e) { ta.select(); copy.textContent = "Selected. Copy it now"; }
    });
    wrap.append(E("p", null, "This code holds your whole game on day " + S.day + "."), ta, copy);
    openModal("Backup code", wrap, [["Done", () => {}]]);
  }
  function showImport() {
    const wrap = E("div"); wrap.style.cssText = "display:grid;gap:8px";
    const ta = E("textarea", "codebox"); ta.placeholder = "Paste a code that starts with ITT1:"; ta.id = "importCode"; ta.setAttribute("aria-label", "Backup code to load");
    wrap.append(E("p", null, "This replaces your current game."), ta);
    openModal("Load a backup code", wrap, [["Load it", () => { if (!importCode(ta.value)) notify("That code didn't work", "Make sure you copied the whole code, starting with ITT1:"); else notify("Game loaded", "You're back on day " + S.day + "."); }], ["Cancel", () => {}]]);
  }
  function renameGym() {
    const wrap = E("div"); const inp = E("input"); inp.id = "nameInput"; inp.maxLength = 24; inp.value = S.name;
    inp.style.cssText = "width:100%;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--chalk);font:600 16px var(--f-body);box-sizing:border-box";
    inp.setAttribute("aria-label", "Gym name"); inp.setAttribute("autocomplete", "off"); wrap.append(inp);
    const saveName = () => { S.name = inp.value.trim() || "Iron Temple"; };
    openModal("Rename your gym", wrap, [["Save", saveName], ["Cancel", () => {}]]);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { saveName(); closeModal(); refresh(); save(); } });
  }

  function settingsMenu() {
    const wrap = E("div"); wrap.style.cssText = "display:grid;gap:8px";
    const mk = (label, cls, fn) => { const b = E("button", "btn " + cls); b.type = "button"; b.textContent = label; b.addEventListener("click", fn); return b; };
    const hap = mk("Haptics: " + (S.haptics ? "On" : "Off"), "", () => { S.haptics = !S.haptics; hap.textContent = "Haptics: " + (S.haptics ? "On" : "Off"); buzz(); save(); });
    wrap.append(
      mk("Rename gym", "", () => { closeModal(); renameGym(); }),
      hap,
      mk("Show backup code", "", () => { closeModal(); showExport(); }),
      mk("Load a backup code", "", () => { closeModal(); showImport(); })
    );
    const bak = readBackup();
    wrap.append(mk(bak ? "Restore auto-backup from day " + bak.day : "No auto-backup yet", "r", () => {
      const b = readBackup(); if (!b) return;
      closeModal(); S = migrate(b); syncLayout(); resetScene(); lastTier = -1; buildTab(); save();
      notify("Backup restored", "You're back on day " + S.day + ".");
    }));
    wrap.append(E("p", "muted", "Your game saves after every action, with an automatic backup every 10 days. Haptics need an iPhone on iOS 18 or later."));
    openModal("Settings", wrap, [["Done", () => {}]]);
  }

  // ======================= BOOT =======================
  function start(data) {
    readColors();
    const fromHot = data && data.state;
    const loaded = fromHot ? migrate(data.state) : load();
    if (loaded) S = loaded;
    else logMsg("You open " + S.name + " in " + city().name + " with $25, a couch in the back office and about 200 days to make it.");
    syncLayout();
    try { const t = localStorage.getItem(SAVE_KEY + ":tab"); if (t && TABS.some(x => x[0] === t)) tab = t; } catch (e) {}
    FOCUS.forEach(fc => {
      const b = E("button", null, fc.name); b.type = "button"; b.dataset.f = fc.id;
      b.addEventListener("click", () => { if (S.dead) return; S.focus = fc.id; buzz(); refresh(); save(); });
      el("focusRow").append(b);
    });
    buildTabBar(); setTab(tab);
    if (S.dead) die(S.deathReason);
    else if (restoredFromDay != null) notify("Save restored", "Your latest save was damaged, so the game loaded the automatic backup from day " + restoredFromDay + ".");

    el("coachBtn").addEventListener("click", doCoach);
    el("restBtn").addEventListener("click", doRest);
    el("logBtn").addEventListener("click", showLog);
    el("gymName").addEventListener("click", renameGym);
    el("restartBtn").addEventListener("click", restartMenu);
    el("settingsBtn").addEventListener("click", settingsMenu);
    document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
    window.addEventListener("pagehide", save);

    buildFixtures(); sceneDirty = false;
    for (let i = 0, n = Math.min(memberTarget(), 8); i < n; i++) { const p = spawn("member"); p.x = rnd(120, 640); p.y = rnd(180, 380); p.act = "walk"; p.alpha = 1; }
    requestAnimationFrame(frame);

    if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ state: S }));
  }

  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
