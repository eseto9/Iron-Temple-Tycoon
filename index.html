<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Temple">
<meta name="theme-color" content="#16181b">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Iron Temple Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column. Sticky owner bar on top, tab content in the middle,
   a fixed action dock (Coach / Rest) and tab bar at the bottom where the thumb rests.
   Rubber-floor dark look with bumper-plate colors, by choice. */
:root {
  color-scheme: dark;
  --floor: #16181b;
  --speck: #22252a;
  --panel: #1f2226;
  --panel-2: #272b30;
  --line: #353a41;
  --chalk: #ecebe6;
  --muted: #9aa1a9;
  --red: #d8432f;
  --blue: #2f6fd8;
  --yellow: #ebbb24;
  --green: #36a35a;
  --white: #e4e4e0;
  --orange: #e27d2c;
  --purple: #8d62d8;
  --plumbob: #4fd36f;
  --up: #4cc274;
  --down: #ef6a55;
  --on-yellow: #1a1606;
  --dock-h: 132px;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body {
  background-color: var(--floor);
  background-image:
    radial-gradient(circle at 20% 30%, var(--speck) 1px, transparent 1.5px),
    radial-gradient(circle at 70% 80%, var(--speck) 1px, transparent 1.5px);
  background-size: 14px 14px, 19px 19px;
  color: var(--chalk); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
.app { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(var(--dock-h) + 16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
button { font: inherit; color: inherit; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

/* ---- owner bar ---- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--floor); padding-block: 10px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 7px; }
.hdr-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.k { font-family: var(--f-num); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.left { font-family: var(--f-num); font-weight: 700; font-size: 14px; }
.left .lim { color: var(--muted); font-weight: 500; }
.hdr-tools { display: flex; gap: 6px; align-items: center; min-width: 0; }
.gname { font-family: var(--f-display); font-weight: 900; font-size: 17px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: none; border: 0; padding: 0 4px; max-width: 12ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; min-height: 36px; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.hdr-main { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.big { font-family: var(--f-num); font-weight: 700; font-size: clamp(24px, 7vw, 34px); line-height: 1; font-variant-numeric: tabular-nums; }
.cash { color: var(--yellow); text-align: right; }
.cash.neg { color: var(--down); }
.sub-line { display: flex; justify-content: space-between; gap: 6px 10px; font-family: var(--f-num); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.sub-line b { color: var(--chalk); font-weight: 500; }
.ebar { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.ebar > i { display: block; height: 100%; background: var(--green); width: 0; transition: width .2s; }
.ticker { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 13.5px; min-width: 0; cursor: pointer; width: 100%; text-align: left; }
.ticker span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ticker .k { flex: none; }

/* ---- generic blocks ---- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.sec { display: flex; justify-content: space-between; align-items: end; gap: 10px; margin-top: 6px; }
.sec h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; line-height: 1; text-wrap: balance; }
.sec p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.sec .meta { font-family: var(--f-num); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.list { display: grid; gap: 8px; }
.muted { color: var(--muted); }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.up-c { color: var(--up); } .down-c { color: var(--down); }

.btn { font-family: var(--f-num); font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 0 12px; min-height: 40px; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--chalk); white-space: nowrap; }
.btn.y { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); }
.btn.g { background: transparent; border-color: var(--up); color: var(--up); }
.btn.r { background: transparent; border-color: var(--down); color: var(--down); }
.btn.b { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { background: transparent; border-color: var(--line); color: var(--muted); cursor: not-allowed; opacity: .75; }

.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; }
.row .nm { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .nt { font-size: 12.5px; color: var(--muted); }
.row .rs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.row .pr { font-family: var(--f-num); font-weight: 700; font-size: 13.5px; text-align: right; display: grid; }
.row .pr small { font-weight: 500; font-size: 10.5px; color: var(--muted); }
.row.dim { opacity: .5; }
.row.cur { border-color: var(--green); box-shadow: inset 3px 0 0 var(--green); }
.tag { font-family: var(--f-num); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; border: 1px solid currentColor; }
.tag.done { color: var(--up); } .tag.open { color: var(--yellow); } .tag.lock { color: var(--muted); } .tag.study { color: var(--blue); } .tag.cur { color: var(--green); }

/* hustle cards */
.act { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 10px 10px; cursor: pointer; text-align: left; width: 100%; min-height: 68px; }
.act:active:not(:disabled) { transform: translateY(1px); border-color: var(--muted); }
.act:disabled { cursor: not-allowed; opacity: .5; }
.plate { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 3px rgba(0,0,0,.18); }
.plate i { width: 14px; height: 14px; border-radius: 50%; background: #c9cdd2; box-shadow: inset 0 0 0 3px #8e949b; display: block; }
.act .nm { font-family: var(--f-display); font-weight: 900; font-size: 22px; text-transform: uppercase; line-height: 1; letter-spacing: .02em; }
.act .nt { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.chip { font-family: var(--f-num); font-weight: 700; font-size: 12px; padding: 5px 8px; border-radius: 4px; background: var(--panel-2); color: var(--yellow); white-space: nowrap; text-align: right; }
.chip small { display: block; font-weight: 500; font-size: 10px; color: var(--muted); }

/* checklist + overhead */
.warm-h { display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; width: 100%; text-align: left; min-height: 36px; }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.step .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; color: var(--floor); margin-top: 1px; }
.step.done .ck { background: var(--up); border-color: var(--up); }
.step.done .st { text-decoration: line-through; color: var(--muted); }
.step .st { font-weight: 700; }
.step .sd { font-size: 12.5px; color: var(--muted); }
.step .rw { font-family: var(--f-num); font-size: 12px; color: var(--up); white-space: nowrap; }
.burn { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--down); border-radius: 6px; padding: 9px 12px; cursor: pointer; width: 100%; text-align: left; min-height: 44px; }
.burn .num { color: var(--down); font-weight: 700; }
.burn-list { display: grid; gap: 4px; font-size: 13px; padding: 8px 12px 4px; }
.burn-list div { display: flex; justify-content: space-between; gap: 10px; }
.outlook { border-left: 3px solid var(--up); }
.outlook[data-status="warn"] { border-left-color: var(--orange); }
.outlook[data-status="bad"] { border-left-color: var(--down); }
.pill { font-family: var(--f-num); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; vertical-align: 1px; }
.pill.ok { background: rgba(76,194,116,.16); color: var(--up); }
.pill.warn { background: rgba(226,125,44,.18); color: var(--orange); }
.pill.bad { background: rgba(239,106,85,.18); color: var(--down); }
.ol-lines { display: grid; gap: 5px; font-size: 13.5px; }
.ol-lines div { display: flex; justify-content: space-between; gap: 10px; }
.ol-lines .ol-next { margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; }
.warn-c { color: var(--orange); }

/* gym scene */
.scene { position: relative; border-radius: 7px; overflow: hidden; background: var(--panel-2); }
#gymCanvas { display: block; width: 100%; height: auto; aspect-ratio: 800 / 480; max-width: 100%; touch-action: manipulation; }
#gymCanvas.editing { touch-action: none; cursor: grab; }
.scene-cap { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; font-size: 13.5px; }
.scene-cap b { color: var(--plumbob); }
.edit-bar { display: grid; gap: 8px; }
.edit-bar .btns { justify-content: space-between; }
.store-list { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font-family: var(--f-num); font-size: 12px; background: transparent; color: var(--muted); border: 0; padding: 0 12px; min-height: 34px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--floor); }

/* supply room */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.idx { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 12px; align-items: center; }
.idx .big { font-size: 30px; }
.good { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.good-h { display: flex; justify-content: space-between; gap: 10px; }
.good-h .nm { font-weight: 700; font-size: 16px; }
.spark { width: 100%; height: 44px; display: block; }
.qty { display: grid; grid-template-columns: auto minmax(0, 1fr) 4ch; gap: 10px; align-items: center; }
.qty input { width: 100%; accent-color: var(--yellow); height: 32px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.fin { border-color: var(--blue); }
.fin dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; font-size: 14px; }
.fin dt { color: var(--muted); }
.fin dd { margin: 0; font-family: var(--f-num); text-align: right; }
.fin .tot { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 700; color: var(--chalk); }
.pbar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.pbar > i { display: block; height: 100%; background: var(--blue); width: 0; }

.credit { grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center; }
.credit svg { width: 96px; height: 96px; }
.credit .lvl { font-family: var(--f-display); font-weight: 900; font-size: 30px; text-transform: uppercase; line-height: 1; }
.nw-chart { width: 100%; height: 120px; display: block; }
.fin-list { gap: 0; }
.fin-list div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.fin-list div:last-child { border-bottom: 0; font-weight: 700; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.bigname { font-family: var(--f-display); font-weight: 900; font-size: 30px; text-transform: uppercase; line-height: 1; }

/* action dock + tab bar */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock { max-width: 680px; margin: 0 auto; padding: 8px 16px 6px; display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px; }
.dock button { border-radius: 10px; min-height: 58px; cursor: pointer; display: grid; align-content: center; justify-items: start; gap: 1px; padding: 6px 14px; text-align: left; border: 0; }
.dock .coach { background: var(--yellow); color: var(--on-yellow); }
.dock .rest { background: var(--panel-2); border: 1px solid var(--line); }
.dock .t { font-family: var(--f-display); font-weight: 900; font-size: 21px; text-transform: uppercase; line-height: 1; }
.dock .s { font-family: var(--f-num); font-size: 11px; font-weight: 700; opacity: .8; }
.dock button:active:not(:disabled) { transform: scale(.98); }
.dock button:disabled { opacity: .45; cursor: not-allowed; }
nav.tabs .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
nav.tabs button { background: none; border: 0; cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 6px 2px 8px; color: var(--muted); font-size: 10.5px; font-weight: 600; position: relative; min-height: 50px; }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--yellow); }
nav.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 24%; right: 24%; height: 3px; border-radius: 0 0 3px 3px; background: var(--yellow); }

.floaty { position: fixed; pointer-events: none; font-family: var(--f-num); font-weight: 700; color: var(--yellow); font-size: 18px; animation: floatUp .9s ease-out forwards; text-shadow: 0 2px 0 var(--floor); z-index: 9; }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -60px); } }

/* modal + toast */
.modal-back { position: fixed; inset: 0; background: rgba(8,9,11,.72); z-index: 20; display: grid; place-items: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 420px; padding: 20px; display: grid; gap: 12px; max-height: 80vh; overflow: auto; -webkit-overflow-scrolling: touch; }
.modal h3 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 28px; text-transform: uppercase; line-height: 1.05; color: var(--yellow); text-wrap: balance; }
.modal p { margin: 0; }
.modal .btns { justify-content: flex-end; }
.modal .btns.stack { display: grid; }
.log-list { display: grid; gap: 6px; font-size: 13.5px; }
.log-list div { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
#toast { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--chalk); color: var(--floor); font-weight: 600; padding: 9px 14px; border-radius: 8px; max-width: calc(100% - 32px); z-index: 30; box-shadow: 0 6px 24px rgba(0,0,0,.45); text-align: center; }
@media (max-width: 420px) { .idx { grid-template-columns: 1fr; } .row .nm { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { .floaty { animation-duration: .01s; } .ebar > i { transition: none; } }
</style>


<style>
  /* standalone page: no host wrapper, so handle margins and the notch here */
  html, body { margin: 0; }
  *, *::before, *::after { box-sizing: border-box; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .hdr { top: 0; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hdr-top">
      <div><div class="k">Life left</div><div class="left"><span id="hLeft">0y 200d</span> <span class="lim">· day <span id="hDay">0</span></span></div></div>
      <div class="hdr-tools">
        <button class="gname" id="gymName" type="button" aria-label="Rename your gym">Iron Temple</button>
        <button class="icon-btn" id="restartBtn" type="button" aria-label="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      </div>
    </div>
    <div class="hdr-main">
      <div><div class="k">Age</div><div class="big" id="hAge">22y 0d</div></div>
      <div><div class="k" style="text-align:right">Cash</div><div class="big cash" id="hCash">$0.00</div></div>
    </div>
    <div class="sub-line"><span>Energy <b id="hEn">100/100</b></span><span>Dues <b id="hRate">$0</b>/day</span><span>Net <b id="hNet">$0</b></span></div>
    <div class="ebar"><i id="hEnBar"></i></div>
    <button class="ticker" type="button" id="logBtn"><span id="hTick">Welcome to your gym.</span><span class="k">Log ›</span></button>
  </header>

  <section id="sceneWrap" class="card" aria-label="Gym floor">
    <div class="scene" id="scene">
      <canvas id="gymCanvas" width="800" height="480" aria-label="Your gym floor"></canvas>
    </div>
    <div id="sceneCap"></div>
  </section>

  <div id="view" style="display:grid;gap:14px"></div>
</div>

<div class="bottom">
  <div class="dock">
    <button class="coach" id="coachBtn" type="button"><span class="t">Coach clients</span><span class="s" id="coachSub">+$3.00 · −8 energy · 1 day</span></button>
    <button class="rest" id="restBtn" type="button"><span class="t">Rest</span><span class="s">+35 energy · 1 day</span></button>
  </div>
  <nav class="tabs" aria-label="Sections"><div class="in" id="tabs" role="tablist"></div></nav>
</div>
<div id="modalRoot"></div>
<div id="toast" hidden></div>

<script>
(function () {
  const SAVE_KEY = "iron-temple-tycoon-v3";
  const START_AGE = 22;
  const BASE_DAYS = 200;      // days to live before any upgrades
  const COACH_EN = 8, REST_EN = 35;

  // ======================= DATA =======================
  // rates are dollars per day
  const GENS = [
    { id: "mat",   name: "Yoga Mats",         base: 15,     rate: 2,     color: "--green" },
    { id: "bells", name: "Dumbbell Rack",     base: 100,    rate: 12,    color: "--blue" },
    { id: "tread", name: "Treadmill",         base: 1100,   rate: 48,    color: "--white" },
    { id: "rack",  name: "Squat Rack",        base: 12000,  rate: 240,   color: "--red" },
    { id: "pt",    name: "Personal Trainer",  base: 130000, rate: 1200,  color: "--yellow", cert: "cpt", staff: true },
    { id: "bar",   name: "Smoothie Bar",      base: 1.4e6,  rate: 6000,  color: "--orange", cert: "nutri" },
    { id: "sauna", name: "Sauna & Steam",     base: 2e7,    rate: 32000, color: "--purple" },
    { id: "pool",  name: "Lap Pool",          base: 3.3e8,  rate: 1.8e5, color: "--blue" },
    { id: "arena", name: "Competition Stage", base: 5.1e9,  rate: 1.04e6,color: "--red", cert: "cscs" },
    { id: "celeb", name: "Celebrity Coach",   base: 7.5e10, rate: 6.4e6, color: "--yellow", cert: "mba", staff: true }
  ];
  const GEN_BY_ID = Object.fromEntries(GENS.map(g => [g.id, g]));
  const GEN_UP_NAMES = {

  function outlook() {

    // for each option: how many days until you can afford it at today's pace
    const scored = lifeOptions().map(o => {
      const pace = net - o.extra;
      const gap = Math.max(0, o.cost - S.cash);
      const wait = gap === 0 ? (pace >= 0 ? 0 : Infinity) : (net > 0 ? Math.ceil(gap / net) : Infinity);
      const ready = wait + o.study < left && pace >= 0;
      const needPerDay = Math.max(0, (o.cost - S.cash) / Math.max(1, left - o.study - 1) - net) + Math.max(0, -pace);
      return Object.assign(o, { wait, ready, needPerDay });
    });
    const reachable = scored.filter(o => o.ready).sort((a, b) => a.wait - b.wait || b.days - a.days);
    const cheapest = scored.slice().sort((a, b) => a.needPerDay - b.needPerDay)[0] || null;
    const best = reachable[0] || cheapest;

  function occupied(skipKey) {
    const g = Array.from({ length: ROWS }, () => new Array(COLS).fill(false));
    S.layout.forEach(it => { if (it.c == null || it.k === skipKey) return; const fp = FP[it.t]; for (let r = it.r; r < it.r + fp.h; r++) for (let c = it.c; c < it.c + fp.w; c++) if (g[r]) g[r][c] = true; });
    return g;
  }
  function fits(t, c, r, grid) {
    const fp = FP[t];
    if (c < 0 || r < 0 || c + fp.w > COLS || r + fp.h > ROWS) return false;
    for (let y = r; y < r + fp.h; y++) for (let x = c; x < c + fp.w; x++) if (grid[y][x]) return false;
    return true;
  }
  function autoPlace(it) {
    const fp = FP[it.t], grid = occupied(it.k);
    let best = null, bd = 1e9;
    for (let r = 0; r <= ROWS - fp.h; r++) for (let c = 0; c <= COLS - fp.w; c++) {
      if (!fits(it.t, c, r, grid)) continue;
      const d = Math.hypot(c - fp.anchor[0], (r - fp.anchor[1]) * 1.3);
      if (d < bd) { bd = d; best = [c, r]; }
    }
    if (best) { it.c = best[0]; it.r = best[1]; return true; }
    it.c = null; it.r = null; return false;
  }
  // make the layout match what you own: add new items, drop sold ones

      let items = S.layout.filter(i => i.t === t);
      while (items.length > own) { const drop = items.find(i => i.c == null) || items[items.length - 1]; S.layout.splice(S.layout.indexOf(drop), 1); items = S.layout.filter(i => i.t === t); }
      for (let n = items.length; n < own; n++) { const it = { k: S.nextKey++, t, c: null, r: null }; S.layout.push(it); if (!autoPlace(it)) stored++; }
    });

  function buildFixtures() {
    fixtures = S.layout.filter(it => it.c != null).map(it => {
      const fp = FP[it.t];
      const x = it.c * CELL, y = WALL + it.r * CELL;
      const flat = it.t === "mat" || it.t === "pool" || it.t === "arena";
      const sortY = { bells: y + 42, tread: y + 14, rack: y + 62, bar: y + 4, sauna: y + 146 }[it.t] ?? y;

  const totalSpots = () => fixtures.reduce((a, f) => a + f.spots.length, 0);

  function spawn(role) {
    const p = { id: nextId++, role: role || "member", x: DOOR.x, y: DOOR.y, tx: DOOR.x, ty: DOOR.y, facing: 1, phase: Math.random() * 6, alpha: 0,

  function moveTo(p, x, y, act) { p.tx = x; p.ty = y; p.state = "go"; p.act = act || "walk"; }
  function goWander(p) {
    const grid = occupied();

    const taken = new Set(people.filter(q => q !== p && q.after === "idle").map(q => Math.floor(q.tx / CELL) + "," + Math.floor((q.ty - WALL) / CELL)));
    for (let i = 0; i < 30; i++) {

    }

  function nextTask(p) {
    if (p.role === "pt") {

      if (busy.length && Math.random() < 0.8) { const m = pick(busy); p.coachee = m.id; moveTo(p, Math.min(W - 10, m.x + 20), m.y + 3, "walk"); p.after = "coach"; }
      else goWander(p);
      return;
    }
    if (p.role === "celeb") { goWander(p); p.after = Math.random() < 0.6 ? "flex" : "idle"; return; }
    const free = [];
    fixtures.forEach(f => f.spots.forEach((s, i) => { if (!s.taken) free.push([f, s, i]); }));
    if (free.length && Math.random() < 0.85) {
      const [f, s, i] = pick(free);
      s.taken = p.id; p.spot = s; p.spotK = f.k; p.spotIdx = i;

  function release(p) { if (p.spot) { p.spot.taken = null; p.spot = null; } p.hidden = false; }
  function updatePerson(p, dt, t) {

    if (p.act === "leave") { const dd = Math.hypot(p.x - DOOR.x, p.y - DOOR.y); if (dd < 50) p.alpha = Math.max(0, Math.min(p.alpha, dd / 50)); }
    else p.alpha = Math.min(1, p.alpha + dt * 2.5);

    S.loans.forEach(l => ll.append(row({ name: l.kind + " loan", note: () => money(l.pay) + "/day · " + (l.apr * 100).toFixed(1) + "% APR", price: () => money(l.bal), btns: [B("Pay off", "r", () => { if (S.cash < l.bal) return; S.cash -= l.bal; S.loans = S.loans.filter(x => x !== l); S.credit = Math.min(850, S.credit + 10); logMsg("Paid off a " + l.kind.toLowerCase() + " loan."); }, () => S.cash < l.bal)] })));
    const borrow = p => { const a = Math.floor(bizLimit() * p); if (a < 50) return; S.loans.push(makeLoan("Business", a, bizApr(), 3)); S.cash += a; logMsg("Borrowed " + money(a) + "."); };
    ll.append(row({ name: "Business loan", note: () => bizLimit() >= 50 ? "You can borrow up to " + money(bizLimit()) : "Build credit or net worth to qualify", btns: [B("25%", "g", () => borrow(0.25), () => bizLimit() < 200), B("Max", "g", () => borrow(1), () => bizLimit() < 50)] }));
    f.append(ll);
    return f;
  }

  // ---- HOME ----
  function tabHome() {
    const f = document.createDocumentFragment();
    const cur = E("div", "card");
    cur.append(E("div", "k", "Living in"));
    const nm = E("div", "bigname"); nm.textContent = home().name; cur.append(nm);
    cur.append(T(E("div", "num"), () => "Lifespan " + ydays(lifespanDays()) + " from day one · " + ydays(daysLeft()) + " left"));
    cur.append(T(E("div", "muted"), () => "Base " + BASE_DAYS + "d · home +" + home().life + "d · meals +" + food().life + "d · certs +" + certLife() + "d · physique +" + Math.round(S.physique * 1.5) + "d · extras " + (S.bonusDays >= 0 ? "+" : "") + S.bonusDays + "d"));
    f.append(cur);

    f.append(sec("Housing", "Better housing, longer life, more energy", HOMES.length + " levels"));
    const hl = E("div", "list");
    HOMES.forEach((h, i) => {
      const isCur = S.home === h.id, owned = S.homesOwned[h.id], prevOk = i === 0 || S.homesOwned[HOMES[i - 1].id];
      const note = (h.life ? "+" + lifeTxt(h.life) + " life" : "No life bonus") + " · " + h.max + " max energy" + (h.burn ? " · −" + money(h.burn) + "/day" : "");
      const btn = isCur ? B("Home", "", () => {}, () => true)
        : owned ? B("Move back", "", () => { S.home = h.id; logMsg("Moved into " + h.name + "."); })
        : prevOk ? B("Move in", "y", () => { if (S.cash < h.cost) return; S.cash -= h.cost; S.homesOwned[h.id] = true; S.home = h.id; logMsg("Moved into " + h.name + "."); checkWarm(); }, () => S.cash < h.cost)
        : B("Locked", "", () => {}, () => true);
      hl.append(row({ name: h.name, tag: isCur ? mkTag("Current", "cur") : null, note, price: h.cost ? money(h.cost) : "Free", small: h.cost ? "move-in" : null, cls: isCur ? "cur" : (!owned && !prevOk ? "dim" : ""), btns: [btn] }));
    });
    f.append(hl);

    f.append(sec("Meal plan", "Food sets daily energy and adds life"));
    const fl = E("div", "list");
    FOODS.forEach(x => {
      const isCur = S.food === x.id;
      fl.append(row({ name: x.name, tag: isCur ? mkTag("Current", "cur") : null, note: "+" + x.regen + " energy/day" + (x.life ? " · +" + lifeTxt(x.life) + " life" : ""), price: money(x.burn), small: "per day", cls: isCur ? "cur" : "",
        btns: [isCur ? B("Eating", "", () => {}, () => true) : B("Switch", "y", () => { S.food = x.id; logMsg("Switched to " + x.name.toLowerCase() + "."); })] }));
    });
    f.append(fl);

    f.append(sec("Self-care", "Train, rest, recover", () => "Physique " + S.physique + "/100"));
    const sl = E("div", "list");
    const cdOk = (id, days) => S.cd[id] == null || S.day - S.cd[id] >= days;
    const train = E("button", "btn y", "Lift"); train.type = "button"; train.addEventListener("click", () => doTrain());
    on(() => { train.disabled = S.energy < 20 || S.physique >= 100; });
    sl.append(row({ name: "Train yourself", note: "1 day · −20 energy · +1 physique · each point adds 1.5 days of life", price: "Free", btns: [train] }));
    const care = (id, name, note, cost, days, fx) => sl.append(row({ name, note: () => cdOk(id, days) ? note : note + " · ready in " + (days - (S.day - S.cd[id])) + "d", price: money(cost),
      btns: [B("Book", "y", () => { if (S.cash < cost || !cdOk(id, days)) return; S.cash -= cost; S.cd[id] = S.day; fx(); logMsg(name + " booked."); }, () => S.cash < cost || !cdOk(id, days))] }));
    care("check", "Doctor checkup", "+20 days life · every 90 days", 250, 90, () => { S.bonusDays += 20; });
    care("massage", "Sports massage", "Full energy · every 20 days", 120, 20, () => { S.energy = maxEnergy(); });
    care("trip", "Weekend getaway", "+15 days life, full energy · every 60 days", 1500, 60, () => { S.bonusDays += 15; S.energy = maxEnergy(); });
    care("vac", "Two-week vacation", "+60 days life · once a year", 40000, 365, () => { S.bonusDays += 60; });
    f.append(sl);

    f.append(sec("Legacy", "Carries over when a life ends"));
    f.append(row({ name: S.legacy + " ★ · life #" + S.lives, note: "Each star adds 10% to everything you earn. Stars come from your best net worth in a life. Restart from the ↻ button up top.", btns: [] }));
    return f;
  }

  // ======================= HEADER + REFRESH =======================
  let lastTier = -1;
  function refresh() {
    const dl = daysLeft();
    const hl = el("hLeft"); hl.textContent = ydays(dl); hl.style.color = dl < 30 ? "var(--down)" : dl < 120 ? "var(--orange)" : "var(--up)";
    el("hDay").textContent = S.day;
    el("hAge").textContent = ydays(ageDays());
    const hc = el("hCash"); hc.textContent = money(S.cash); hc.classList.toggle("neg", S.cash < 0);
    el("hEn").textContent = Math.floor(S.energy) + "/" + maxEnergy();
    el("hEnBar").style.width = Math.min(100, S.energy / maxEnergy() * 100) + "%";
    el("hRate").textContent = money(income());
    el("hNet").textContent = money(netWorth());
    el("hTick").textContent = S.log[0] ? S.log[0].m : "Welcome to " + S.name + ".";
    el("gymName").textContent = S.name;
    const cb = el("coachBtn");
    cb.disabled = S.dead || S.energy < COACH_EN;
    el("coachSub").textContent = S.energy < COACH_EN ? "Too tired. Rest first." : "+" + money(coachValue()) + " · −" + COACH_EN + " energy · 1 day";
    el("restBtn").disabled = S.dead;
    const ti = tierIndex();
    if (ti !== lastTier) { if (lastTier !== -1 && ti > lastTier) { logMsg("Your gym is now a " + TIERS[ti].name + "."); notify("New level: " + TIERS[ti].name, "Your gym has earned " + money(TIERS[ti].at) + " in total. The place gets a makeover and new supplies show up in the supply room."); } lastTier = ti; }
    if (tabKey() !== curKey) { buildTab(); return; }
    U.forEach(f => f());
  }

  // ======================= MODAL / TOAST =======================
  // Popups stay until you tap a button. If one is already showing, the next waits its turn.
  let modalOpen = false;
  const modalQueue = [];
  function openModal(title, body, buttons, sticky, stack) {
    if (modalOpen) { modalQueue.push([title, body, buttons, sticky, stack]); return; }
    modalOpen = true;
    const back = E("div", "modal-back"); const m = E("div", "modal"); m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true");
    const h = E("h3"); h.textContent = title; m.append(h);
    if (typeof body === "string") { const p = E("p"); p.textContent = body; m.append(p); } else m.append(body);
    const bs = E("div", "btns" + (stack ? " stack" : ""));
    buttons.forEach(([label, fn], i) => { const b = E("button", "btn " + (i === 0 ? "y" : "")); b.type = "button"; b.textContent = label; b.addEventListener("click", () => { closeModal(); fn(); refresh(); save(); }); bs.append(b); });
    m.append(bs); back.append(m);
    el("modalRoot").innerHTML = ""; el("modalRoot").append(back);
  }
  function closeModal() {
    modalOpen = false; el("modalRoot").innerHTML = "";
    if (modalQueue.length) setTimeout(() => { if (!modalOpen && modalQueue.length) openModal(...modalQueue.shift()); }, 120);
  }
  // a one-button popup for news worth stopping for
  function notify(title, text, btn) { openModal(title, text, [[btn || "Got it", () => {}]]); }
  let toastT = 0;
  function toast(msg) { const t = el("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3000); }
  function showLog() {
    const l = E("div", "log-list");
    if (!S.log.length) l.append(E("div", "muted", "Nothing yet."));
    S.log.slice(0, 50).forEach(x => { const d = E("div"); d.append(E("span", "muted num", "Day " + x.d)); const s = E("span"); s.textContent = x.m; d.append(s); l.append(d); });
    openModal("Front desk log", l, [["Close", () => {}]]);
  }
  function renameGym() {
    const wrap = E("div"); const inp = E("input"); inp.id = "nameInput"; inp.maxLength = 24; inp.value = S.name;
    inp.style.cssText = "width:100%;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--chalk);font:600 16px var(--f-body);box-sizing:border-box";
    inp.setAttribute("aria-label", "Gym name"); inp.setAttribute("autocomplete", "off"); wrap.append(inp);
    const saveName = () => { S.name = inp.value.trim() || "Iron Temple"; };
    openModal("Rename your gym", wrap, [["Save", saveName], ["Cancel", () => {}]]);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { saveName(); closeModal(); refresh(); save(); } });
  }

  // ======================= BOOT =======================
  function start(data) {
    readColors();
    const fromHot = data && data.state;
    const loaded = fromHot ? Object.assign(fresh(), data.state) : load();
    if (loaded) S = loaded;
    else logMsg("You open " + S.name + " with $25, a couch in the back office and about 200 days to make it.");
    ensureGoods(); syncLayout();
    try { const t = localStorage.getItem(SAVE_KEY + ":tab"); if (t && TABS.some(x => x[0] === t)) tab = t; } catch (e) {}
    buildTabBar(); setTab(tab);
    if (S.dead) die();

    el("coachBtn").addEventListener("click", doCoach);
    el("restBtn").addEventListener("click", doRest);
    el("logBtn").addEventListener("click", showLog);
    el("gymName").addEventListener("click", renameGym);
    el("restartBtn").addEventListener("click", restartMenu);
    document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
    window.addEventListener("pagehide", save);

    buildFixtures(); sceneDirty = false;
    for (let i = 0, n = Math.min(memberTarget(), 8); i < n; i++) { const p = spawn("member"); p.x = rnd(120, 640); p.y = rnd(180, 380); p.act = "walk"; }
    requestAnimationFrame(frame);

    if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ state: S }));
  }

  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
